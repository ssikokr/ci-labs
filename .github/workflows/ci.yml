name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Build and Test
    uses: ./.github/workflows/reusable-build.yml   # Call the reusable workflow
    with:
      node-version: '20'
      run-lint: true
    secrets: inherit   # Pass all repository secrets through
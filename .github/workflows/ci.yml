name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the source code
      # GitHub Actions does NOT do this automatically — you must include this!
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Node.js on the runner
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Run the tests
      - name: Run tests
        run: npm test

      # Step 4: Build the application
      - name: Build
        run: npm run build

      # Step 5: Upload the build output so it can be downloaded later
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build       # Name of the artifact
          path: dist/            # Folder to upload
          retention-days: 7      # Keep for 7 days